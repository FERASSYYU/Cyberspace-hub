name: PBH (Project Bounty Hunter)
run-name: "PBH ${{ inputs.mode || 'scheduled local_fixture_benchmark' }} #${{ github.run_number }}"

# Offline only. There is no live-target mode. Scheduled runs use the fixtures only.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Safe local mode"
        type: choice
        required: true
        default: local_fixture_benchmark
        options:
          - local_fixture_benchmark
          - repository_analysis
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: pbh-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pbh:
    name: PBH local analysis
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Mode comes from the event through env, never inline in a shell command.
      PBH_MODE: ${{ github.event_name == 'schedule' && 'local_fixture_benchmark' || inputs.mode }}
      PBH_RETENTION_DAYS: "7"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Display environment (no secrets)
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "Runner image: ${ImageOS:-unknown} ${ImageVersion:-unknown}"
          echo "Mode: $PBH_MODE"
          echo "Event: $GITHUB_EVENT_NAME"

      - name: Set up Python 3.13
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Validate schemas and program profile
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import json, sys
          for path in ("schemas/finding.schema.json", "schemas/program.schema.json",
                       "programs/atmail/program.json", "lab/ground_truth.json"):
              with open(path, encoding="utf-8") as fh:
                  json.load(fh)
          program = json.load(open("programs/atmail/program.json", encoding="utf-8"))
          if program["live_testing_enabled"] is not False:
              print("Live testing must be disabled in the Atmail profile.", file=sys.stderr)
              sys.exit(1)
          print("Schemas and program profile are valid JSON; live testing is disabled.")
          PY

      - name: Unit tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests/unit -t . -v

      - name: Run PBH safe local analysis
        shell: bash
        run: |
          set -Eeuo pipefail
          out="$RUNNER_TEMP/pbh-out"
          if [[ "$PBH_MODE" == "repository_analysis" ]]; then
            input_root="."
          else
            input_root="lab/fixtures"
          fi
          python3 -m pbh.cli --mode "$PBH_MODE" \
            --program programs/atmail/program.json \
            --input "$input_root" \
            --output "$out"
          echo "PBH_OUT=$out" >> "$GITHUB_ENV"

      - name: Run synthetic benchmark
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m benchmark.run_benchmark > "$RUNNER_TEMP/benchmark.json"
          cat "$RUNNER_TEMP/benchmark.json"

      - name: Install and verify actionlint
        shell: bash
        run: |
          set -Eeuo pipefail
          version="1.7.12"
          base="https://github.com/rhysd/actionlint/releases/download/v${version}"
          work="$RUNNER_TEMP/actionlint"
          mkdir -p "$work"
          curl --fail --location --retry 3 -o "$work/checksums.txt" "$base/actionlint_${version}_checksums.txt"
          curl --fail --location --retry 3 -o "$work/actionlint.tar.gz" "$base/actionlint_${version}_linux_amd64.tar.gz"
          expected="$(grep "actionlint_${version}_linux_amd64.tar.gz" "$work/checksums.txt" | awk '{print $1}')"
          echo "$expected  $work/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$work/actionlint.tar.gz" -C "$work" actionlint
          echo "$work" >> "$GITHUB_PATH"

      - name: Run actionlint on workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          "$RUNNER_TEMP/actionlint/actionlint" -color .github/workflows/*.yml

      - name: Run zizmor on workflows
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --quiet "zizmor==1.32.0"
          "$RUNNER_TEMP/zizmor-venv/bin/zizmor" --min-severity medium .github/workflows/

      - name: Upload sanitized reports only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pbh-sanitized-reports
          path: |
            ${{ runner.temp }}/pbh-out/pbh-report.json
            ${{ runner.temp }}/pbh-out/pbh-report.sarif
            ${{ runner.temp }}/pbh-out/pbh-report.md
            ${{ runner.temp }}/pbh-out/pbh-report.csv
          retention-days: 7
          if-no-files-found: error

      - name: Delete temporary files
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          rm -rf "$RUNNER_TEMP/pbh-out" "$RUNNER_TEMP/actionlint" "$RUNNER_TEMP/zizmor-venv" "$RUNNER_TEMP/benchmark.json"
